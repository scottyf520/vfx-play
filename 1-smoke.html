<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写实烟团 · 透明特效播放</title>
<style>
  :root{--line:#2a3342;--panel:#141923;--txt:#c6d0e0;--mut:#7d8aa0;--accent:#5b8cff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0e14;color:var(--txt);font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:20px}
  h1{font-size:16px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
  .stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  canvas{display:block;width:100%;height:auto;aspect-ratio:1/1}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:#10141d}
  button{background:#1d2534;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
  .group{display:flex;gap:6px;align-items:center}
  .lab{color:var(--mut);font-size:12px;margin-right:2px}
  .frame{font-variant-numeric:tabular-nums;color:var(--accent);min-width:64px;text-align:right}
  .note{color:var(--mut);font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>写实烟团 · 透明特效播放页</h1>
  <div class="sub">64 帧 · 宫格 8×8 · 画布逐帧播放，完整保留半透明；棋盘格背景用来证明没有黑底白边</div>

      <button id="play">⏸ 暂停</button>

      <div class="group">
        <span class="lab">背景</span>
        <button data-bg="check" class="on">棋盘格</button>
        <button data-bg="dark">深色</button>
        <button data-bg="light">浅色</button>
      </div>
      <div class="group">
        <span class="lab">播放</span>
        <button id="loop" class="on">循环</button>

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const sheet=new Image();
let bg="check", playing=true, idx=0, last=performance.now(), loopMode=META.mode==="loop";
function checker(){
  const n=24;
  for(let y=0;y<cv.height;y+=n)for(let x=0;x<cv.width;x+=n){
    ctx.fillStyle=((x/n+y/n)%2===0)?"#3a4356":"#2c3445";
    ctx.fillRect(x,y,n,n);
  }
}
function backdrop(){
  if(bg==="check")checker();
  else{ctx.fillStyle=bg==="dark"?"#12161d":"#eef1f6";ctx.fillRect(0,0,cv.width,cv.height);}
}
function draw(i){
  backdrop();
  const cw=META.cell[0],ch=META.cell[1];
  const sx=(i%META.grid[0])*cw, sy=Math.floor(i/META.grid[0])*ch;
  const pad=cv.width*0.06, size=cv.width-pad*2;
  ctx.drawImage(sheet,sx,sy,cw,ch,pad,pad,size,size);
}
function tick(now){
  if(sheet.complete && sheet.naturalWidth>0){
    if(playing){
      if(now-last>=1000/META.fps){
        last=now;
        if(idx<META.frames-1){idx++;}
        else if(loopMode){idx=0;}
        else{playing=false;document.getElementById("play").textContent="▶ 播放";}
        sync();
      }
    }
    draw(idx);
  } else {
    backdrop();
  }
  requestAnimationFrame(tick);
}
function sync(){
  document.getElementById("scrub").value=idx;
  document.getElementById("flab").textContent=(idx+1)+" / "+META.frames;
}
document.getElementById("play").onclick=()=>{
  if(!playing&&idx>=META.frames-1)idx=0;
  playing=!playing;
  document.getElementById("play").textContent=playing?"⏸ 暂停":"▶ 播放";
  last=performance.now();
};
document.getElementById("scrub").oninput=e=>{idx=+e.target.value;playing=false;document.getElementById("play").textContent="▶ 播放";sync();};
document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{
  bg=b.dataset.bg;
  document.querySelectorAll("[data-bg]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
});
document.getElementById("loop").onclick=function(){
  loopMode=!loopMode;
  this.textContent=loopMode?"循环":"单次";
  this.classList.toggle("on",loopMode);
};
sheet.src=META.src;
requestAnimationFrame(tick);
</script>
